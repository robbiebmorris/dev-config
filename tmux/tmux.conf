set -g base-index 1
set -g pane-base-index 1
set -g status-left-length 50
set -g status-left '[#S] '

# Enable mouse mode for scrolling
set -g mouse on
# Scrolling up enters copy mode automatically
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# Don't exit copy mode when dragging with mouse
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# Toggle synchronize-panes (mirror typing into all panes). Used by the A/B/C
# agents window to seed every agent, then turn off to drive them independently.
bind-key y set-window-option synchronize-panes \; display-message 'sync #{?pane_synchronized,ON,OFF}'
